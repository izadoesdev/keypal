name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keypal
          POSTGRES_PASSWORD: keypal_dev
          POSTGRES_DB: keypal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-kysely:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keypal
          POSTGRES_PASSWORD: keypal_dev
          POSTGRES_DB: keypal_kysely
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-drizzle:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keypal
          POSTGRES_PASSWORD: keypal_dev
          POSTGRES_DB: keypal_drizzle
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-prisma:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keypal
          POSTGRES_PASSWORD: keypal_dev
          POSTGRES_DB: keypal_prisma
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test --exclude '**/prisma.test.ts' --exclude '**/kysely.test.ts' --exclude '**/drizzle.test.ts'

      - name: Run Redis tests
        run: bun run test:redis
        env:
          REDIS_URL: redis://localhost:6379

      - name: Run Kysely tests
        run: bun run test:kysely
        env:
          DATABASE_URL: postgresql://keypal:keypal_dev@localhost:5433/keypal_kysely

      - name: Run Drizzle tests
        run: bun run test:drizzle
        env:
          DATABASE_URL: postgresql://keypal:keypal_dev@localhost:5434/keypal_drizzle

      - name: Push Prisma schema
        run: bunx prisma db push
        env:
          DATABASE_URL: postgresql://keypal:keypal_dev@localhost:5435/keypal_prisma

      - name: Run Prisma tests
        run: bun run test:prisma
        env:
          DATABASE_URL: postgresql://keypal:keypal_dev@localhost:5435/keypal_prisma

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.mjs
          test -f dist/index.d.ts
          test -f dist/storage/memory.mjs
          test -f dist/storage/redis.mjs
          test -f dist/storage/drizzle.mjs
          test -f dist/storage/prisma.mjs
          test -f dist/storage/kysely.mjs

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
